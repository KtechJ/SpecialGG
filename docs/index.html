<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Special Gadi Ghar</title>
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2ddd2; --brand:#1f4e79; --brand2:#2d6aa3;
          --good:#1e7b45; --bad:#b3261e; --warn:#a15c00; --soft:#eaf1f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif; background:var(--bg); color:var(--ink); font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff; display:flex; align-items:center; gap:8px; padding:10px 12px; }
  header h1 { flex:1; font-size:18px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:10px; font-size:18px; width:40px; height:40px; }
  main { padding:12px; max-width:720px; margin:0 auto; padding-bottom:80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .stat .l { font-size:12px; color:var(--muted); }
  .stat .v { font-size:20px; font-weight:700; margin-top:2px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .tile { background:var(--brand); color:#fff; border:0; border-radius:14px; padding:16px 10px; font-size:16px; font-weight:600; text-align:center; line-height:1.3; }
  .grid .tile:last-child:nth-child(odd) { grid-column:span 2; }
  .tile span { display:block; font-size:26px; margin-bottom:4px; }
  .tile small { display:block; font-weight:400; opacity:.85; }
  h2 { font-size:16px; margin:4px 0 10px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  textarea { min-height:70px; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row > * { flex:1; min-width:0; }
  .btn { display:inline-block; border:0; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:600; background:var(--brand); color:#fff; text-decoration:none; text-align:center; }
  .btn.full { width:100%; margin-top:14px; }
  .btn.alt { background:var(--soft); color:var(--brand); }
  .btn.red { background:#fbe9e7; color:var(--bad); }
  .btn.green { background:#25a35a; }
  .btn.sm { padding:8px 10px; font-size:14px; border-radius:10px; }
  .btn:disabled { opacity:.5; }
  .list .it { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:center; }
  .list .it:last-child { border-bottom:0; }
  .it .t { font-weight:600; }
  .it .s { font-size:13px; color:var(--muted); margin-top:2px; }
  .num { font-weight:700; white-space:nowrap; text-align:right; }
  .low { color:var(--bad); }
  .ok { color:var(--good); }
  .warn { color:var(--warn); }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px; font-size:14px; font-weight:600; color:var(--muted); }
  .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .line { border:1px dashed var(--line); border-radius:12px; padding:8px; margin-bottom:8px; }
  .total { display:flex; justify-content:space-between; font-size:18px; font-weight:700; margin-top:10px; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:var(--soft); color:var(--brand); font-weight:600; }
  .pill.Ready { background:#e6f4ea; color:var(--good); }
  .in { color:var(--good); } .out { color:var(--bad); }
  .datenav { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .datenav input { flex:1; }
  .datenav button { flex:0 0 46px; height:44px; }
  .sumrow { display:flex; justify-content:space-between; padding:6px 0; }
  .sumrow.big { font-size:18px; font-weight:700; border-top:1px solid var(--line); margin-top:6px; padding-top:10px; }
  .pill.soon { background:#fff1dc; color:var(--warn); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chips button { border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 10px; font-size:13px; }
  .chips button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .rplabel { flex:1; text-align:center; font-weight:700; }
  .rptitle { font-size:14px; margin:12px 0 6px; }
  .tblwrap { overflow-x:auto; margin-bottom:6px; }
  table.rp { border-collapse:collapse; width:100%; font-size:13px; }
  table.rp th { background:var(--brand); color:#fff; text-align:left; padding:6px; white-space:nowrap; font-weight:600; }
  table.rp td { padding:6px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.rp td.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  table.rp tfoot td { font-weight:700; background:var(--soft); }
  .pill.late { background:#fbe9e7; color:var(--bad); }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#222; color:#fff; padding:12px 16px; border-radius:12px; font-size:15px; max-width:92%; display:none; z-index:20; }
  #toast.err { background:var(--bad); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; display:flex; align-items:flex-end; justify-content:center; }
  #modal.hidden { display:none; }
  #modal .sheet { background:var(--bg); width:100%; max-width:720px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:14px; }
  .sheethead { display:flex; justify-content:space-between; align-items:center; }
  .sheethead button { border:0; background:none; font-size:26px; color:var(--muted); }
  pre.bill { white-space:pre-wrap; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14px; }
  .loading { text-align:center; padding:40px; color:var(--muted); }
  .busy { position:fixed; inset:0; background:rgba(255,255,255,.4); z-index:30; display:none; }
</style>
</head>
<body>
<header>
  <button id="back" onclick="go('home')" aria-label="Back">←</button>
  <h1 id="title">Shop</h1>
  <button onclick="refresh()" aria-label="Refresh">⟳</button>
</header>
<main id="app"><div class="loading">Loading… / लोड हो रहा है…</div></main>
<div id="toast"></div>
<div class="busy" id="busy"></div>
<div id="modal" class="hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="modalBody"></div></div>
<script>
// Separate small script: if the main script below fails to run (e.g. Index.html pasted incompletely),
// show the reason instead of "Loading…" forever.
var INDEX_LINES = 1567;   // filled in below so the message can say how long the file must be
function startFailed(reason) {
  var a = document.getElementById('app');
  if (!a || a.getAttribute('data-ok')) return;
  a.innerHTML = '<div class="card" style="margin-top:20px"><h2 class="low">The app could not start · ऐप शुरू नहीं हुआ</h2>' +
    '<div>' + String(reason).replace(/</g, '&lt;') + '</div>' +
    '<div class="muted" style="margin-top:8px">The Index file in Apps Script is <b>incomplete or mixed with old text</b>. ' +
    'It must have exactly <b>' + INDEX_LINES + ' lines</b>, first line &lt;!DOCTYPE html&gt;, last line &lt;/html&gt;.<br>' +
    'Surest fix: in Apps Script delete the Index file (&#8942; &rarr; Delete), click + &rarr; HTML, name it Index, ' +
    'paste Index.html from the copy page into the new empty file, Save, then Deploy &rarr; Manage deployments &rarr; Edit &rarr; New version.</div></div>';
}
window.addEventListener('error', function (e) {
  startFailed((e.message || 'Script error') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
});
// A cut-off file gives no error at all (the browser just skips the unfinished script), so also check after 10 s.
setTimeout(function () { startFailed('The main part of the app did not load.'); }, 10000);
</script>

<script>
let D = null;            // data from the sheet
let screen = 'home';
let saleLines = [];
let stockTab = 'Item', khataTab = 'Customer', purchaseKind = 'Raw';

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const val = id => ($(id) ? $(id).value.trim() : '');
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => { const v = Math.round(num(n)); return (v < 0 ? '−₹' : '₹') + Math.abs(v).toLocaleString('en-IN'); };
const label = it => (String(it.name) + ' ' + String(it.size || '')).trim();
const itemById = id => D.items.find(i => String(i.id) === String(id));
const rawById = id => D.raw.find(i => String(i.id) === String(id));
const tracked = it => it.track !== 'No';   // items added from a typed sale are not stock-counted
const isLow = it => tracked(it) && (num(it.stock) <= 0 || (num(it.low) > 0 && num(it.stock) <= num(it.low)));
const stockTag = x => tracked(x) ? ' (stock ' + num(x.stock) + ')' : '';

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 5000 : 2500);
}
// Two ways to run: inside Google Apps Script (google.script.run, Google login), or as the installed
// Android app (window.SHOP_APP from config.js: talks to the script's doPost with a PIN login token).
const APP = window.SHOP_APP && window.SHOP_APP.url ? window.SHOP_APP : null;
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
};
function api(fn, arg, quiet) {
  $('busy').style.display = 'block';
  const done = () => { $('busy').style.display = 'none'; };
  if (APP) {
    // text/plain keeps this a "simple" request, so the browser does not need a CORS preflight
    return fetch(APP.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, arg, token: store.get('sgg_token') }) })
      .then(r => r.json())
      .then(j => {
        done();
        if (j.ok) return j.result;
        const err = new Error(j.error);
        if (String(j.error).indexOf('AUTH') === 0) { store.set('sgg_token', null); loginScreen(); }
        else if (!quiet) toast(j.error, true);
        throw err;
      }, e => { done(); const err = new Error('No internet or server not reachable / इंटरनेट जांचें'); if (!quiet) toast(err.message, true); throw err; });
  }
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler(r => { done(); res(r); })
      .withFailureHandler(e => { done(); if (!quiet) toast(e.message || String(e), true); rej(e); })[fn](arg);
  });
}
// ---- PIN login (Android app only)
async function loginScreen() {
  closeModal();
  $('back').style.visibility = 'hidden';
  $('title').textContent = APP.shop || 'Special Gadi Ghar';
  $('app').innerHTML = '<div class="loading">Loading… / लोड हो रहा है…</div>';
  let info = { users: [] };
  try { info = await api('users', null, true); } catch (e) { /* shown below */ }
  const last = store.get('sgg_user') || '';
  $('app').innerHTML = `<div class="card" style="max-width:420px;margin:20px auto">
      <h2>Log in · लॉगिन</h2>
      ${info.users.length ? `<label>Who are you? · आप कौन हैं?</label>
        <div class="chips">${info.users.map(u => `<button class="${u === last ? 'on' : ''}" onclick="document.querySelectorAll('.chips button').forEach(b=>b.classList.remove('on'));this.classList.add('on');$('lgName').value=this.textContent">${esc(u)}</button>`).join('')}</div>
        <input id="lgName" type="hidden" value="${esc(last && info.users.includes(last) ? last : (info.users.length === 1 ? info.users[0] : ''))}">
        <label>PIN</label><input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="6–8 digits"
          onkeydown="if(event.key==='Enter')doLogin()">
        <button class="btn full" onclick="doLogin()">Log in · लॉगिन करें</button>`
      : `<div class="low">Could not reach the shop server, or no PIN has been set yet.</div>
        <div class="muted" style="margin-top:6px">Check internet. The owner sets PINs in the Google Sheet: menu <b>Shop → Set app PIN</b>.</div>
        <button class="btn full alt" onclick="loginScreen()">Try again · फिर से</button>`}
    </div>`;
}
async function doLogin() {
  const name = val('lgName'), pin = val('lgPin');
  if (!name) { toast('Tap your name first / अपना नाम चुनें', true); return; }
  if (!pin) { toast('Enter your PIN / PIN डालें', true); return; }
  let r;
  try { r = await api('login', { name, pin }); } catch (e) { $('lgPin').value = ''; return; }   // message already shown
  store.set('sgg_token', r.token); store.set('sgg_user', r.user);
  start();
}
async function logout() {
  try { await api('logout', null, true); } catch (e) { /* already logged out */ }
  store.set('sgg_token', null);
  loginScreen();
}
/** Calls a write function, refreshes data, shows message. */
async function save(fn, arg, quiet) {
  const r = await api(fn, arg, quiet);
  D = r.data; toast(r.msg || 'Saved');
  return r;
}
function openModal(html) { $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
function sheetHead(t) { return `<div class="sheethead"><h2>${t}</h2><button onclick="closeModal()">×</button></div>`; }
function opts(list, sel, text) {
  return list.map(x => `<option value="${esc(x.id)}" ${String(x.id) === String(sel) ? 'selected' : ''}>${esc(text(x))}</option>`).join('');
}
function datalist(id, names) { return `<datalist id="${id}">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>`; }
function phoneLink(phone, text) {
  let p = String(phone || '').replace(/\D/g, '');
  if (p.length === 10) p = '91' + p;
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text);
}
function modeSelect(id, sel) { return `<select id="${id}">${['Cash', 'UPI', 'Bank', 'Cheque'].map(m => `<option ${m === sel ? 'selected' : ''}>${m}</option>`).join('')}</select>`; }
function dmy(iso) { const d = String(iso || '').slice(0, 10); return d.length === 10 ? d.split('-').reverse().join('-') : d; }
function daysLeft(iso) { return Math.round((new Date(String(iso).slice(0, 10) + 'T00:00:00') - new Date(D.today + 'T00:00:00')) / 86400000); }
function dueLabel(iso) {
  const n = daysLeft(iso);
  if (n < 0) return { text: `Late ${-n} day${n < -1 ? 's' : ''} · ${-n} दिन देर`, cls: 'late' };
  if (n === 0) return { text: 'Today · आज', cls: 'late' };
  if (n === 1) return { text: 'Tomorrow · कल', cls: 'soon' };
  return { text: `In ${n} days · ${n} दिन बाद`, cls: '' };
}
function clientByPhone(ph) { const d = String(ph || '').replace(/\D/g, '').slice(-10); return d.length === 10 ? D.clients.find(c => c.phone === d) : null; }
/** When a 10-digit mobile is typed: fill name/address of an old customer and show a note. */
function lookupClient(phoneId, nameId, chipId, addrId) {
  const d = val(phoneId).replace(/\D/g, '');
  const chip = $(chipId);
  if (d.length < 10) { chip.innerHTML = ''; return; }
  const c = clientByPhone(d);
  if (c) {
    if (!val(nameId)) $(nameId).value = c.name;
    if (addrId && $(addrId) && !val(addrId)) $(addrId).value = c.address;
    chip.innerHTML = `<span class="pill Ready">✓ Old customer · पुराने ग्राहक</span> <span class="muted">${c.orders} orders${c.udhaar > 0 ? ` · <b class="warn">udhaar ${money(c.udhaar)}</b>` : ''} · last ${esc(dmy(c.last))}</span>`;
  } else chip.innerHTML = '<span class="pill">New customer · नया ग्राहक</span>';
}
function orderPaid(o) { return o.paid !== undefined && o.paid !== '' ? num(o.paid) : num(o.advance); }
function orderLeft(o) { return Math.max(0, Math.round((num(o.amount) - orderPaid(o)) * 100) / 100); }
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

// ---------- navigation ----------
const SCREENS = {
  home:     ['\u{1F3E0}', 'Home', 'होम'],
  sale:     ['\u{1F9FE}', 'New Sale', 'बिक्री'],
  stock:    ['\u{1F6CF}️', 'Stock', 'स्टॉक'],
  make:     ['\u{1F9F5}', 'Make Gadi', 'गादी बनाओ'],
  purchase: ['\u{1F69A}', 'Purchase', 'खरीद'],
  orders:   ['\u{1F4CB}', 'Orders', 'ऑर्डर'],
  vyapari:  ['\u{1F3EA}', 'Vyapari Khata', 'व्यापारी · देना है'],
  khata:    ['\u{1F465}', 'Customers', 'ग्राहक · उधार'],
  bahi:     ['\u{1F4D4}', 'Bahi Khata', 'बही खाता · रोकड़'],
  reports:  ['\u{1F4CA}', 'Reports', 'रिपोर्ट · PDF / Excel']
};
function go(s) {
  screen = s;
  if (s === 'sale' && !saleLines.length) saleLines = [{ id: '', qty: 1, price: '' }];
  $('back').style.visibility = s === 'home' ? 'hidden' : 'visible';
  $('title').textContent = s === 'home' ? D.shop.name : SCREENS[s][1] + ' · ' + SCREENS[s][2];
  window.scrollTo(0, 0);
  render();
}
function render() { ({ home, sale, stock, make, purchase, orders, khata, bahi, vyapari, reports })[screen](); }
async function refresh() { D = await api('getData'); render(); toast('Updated / अपडेट हुआ'); }

// ---------- Home ----------
function home() {
  const d = D.dash;
  const lowItems = D.items.filter(isLow), lowRaw = D.raw.filter(isLow);
  const soon = addDays(D.today, D.remindDays || 3);
  const due = D.orders.filter(o => (o.status === 'Pending' || o.status === 'Ready') && o.delivery && String(o.delivery).slice(0, 10) <= soon)
    .sort((a, b) => String(a.delivery).localeCompare(String(b.delivery)));
  $('app').innerHTML = `
    ${D.encodingOk === false ? `<div class="card" style="border:2px solid var(--bad)"><h2 class="low">⚠️ Code.gs was pasted with broken Hindi letters</h2>
      <div>Hindi text from Code.gs looks like <code>‡§ö‡§≤‡§æ</code>. Copy <b>Code.gs</b> again from the copy page (not from a file opened in TextEdit/Notepad),
      paste it over the old one in Apps Script, Save, then <b>Deploy → Manage deployments → Edit → New version</b>.
      Then fix the headings by running <b>setup</b> once.</div></div>` : ''}
    ${due.length ? `<div class="card" style="border:2px solid var(--warn)"><h2>\u{1F4C5} Deliveries coming · डिलीवरी करनी है (${due.length})</h2><div class="list">${due.map(o => {
      const dl = dueLabel(o.delivery);
      return `<div class="it" onclick="go('orders')"><div><div class="t">${esc(o.customer)} <span class="pill ${dl.cls}">${dl.text}</span></div>
        <div class="s">${esc(o.details)}</div>
        <div class="s">${esc(dmy(o.delivery))} · Baki <b>${money(orderLeft(o))}</b>${o.status === 'Ready' ? ' · <span class="ok">Ready ✓</span>' : ''}</div></div>
        ${o.phone ? `<a class="btn sm alt" href="tel:${esc(o.phone)}" onclick="event.stopPropagation()">\u{1F4DE}</a>` : ''}</div>`; }).join('')}</div></div>` : ''}
    <div class="stats">
      <div class="stat"><div class="l">Today Sale · आज बिक्री</div><div class="v">${money(d.todaySales)}</div><div class="muted">${d.todayBills} bills</div></div>
      <div class="stat"><div class="l">Today Cash In · आज जमा</div><div class="v ok">${money(d.todayCollect)}</div></div>
      <div class="stat"><div class="l">Month Sale · महीने की बिक्री</div><div class="v">${money(d.monthSales)}</div></div>
      <div class="stat"><div class="l">Month Profit · मुनाफ़ा</div><div class="v ok">${money(d.monthProfit)}</div></div>
      <div class="stat" onclick="go('khata')"><div class="l">To Take · लेना है</div><div class="v warn">${money(d.toTake)}</div></div>
      <div class="stat" onclick="go('vyapari')"><div class="l">To Pay · देना है</div><div class="v low">${money(d.toPay)}</div></div>
      <div class="stat" onclick="go('bahi')"><div class="l">Cash in galla · गल्ले में</div><div class="v">${money(d.cash)}</div></div>
      <div class="stat" onclick="go('bahi')"><div class="l">Bank / UPI · बैंक</div><div class="v">${money(d.bank)}</div></div>
    </div>
    <div class="grid">
      ${['sale', 'stock', 'make', 'purchase', 'orders', 'vyapari', 'khata', 'bahi', 'reports'].map(k =>
        `<button class="tile" onclick="go('${k}')"><span>${SCREENS[k][0]}</span>${SCREENS[k][1]}<small>${SCREENS[k][2]}</small></button>`).join('')}
    </div>

function saleKeep() {
  if ($('sCust')) saleForm = { cust: val('sCust'), phone: val('sPhone'), disc: val('sDisc'), paid: val('sPaid'), mode: val('sMode') };
}
function sale() {
  saleKeep();
  const f = saleForm;
  const sellable = D.items.filter(i => String(i.id));
  $('app').innerHTML = `
    <div class="card">
      <h2>Items · सामान</h2>
      <div id="lines">${saleLines.map((l, i) => `
        <div class="line">
          <select onchange="lineItem(${i}, this.value)">
            <option value="">— Select item / आइटम चुनें —</option>
            <option value="__custom" ${l.custom ? 'selected' : ''}>✏️ Not in list – type it / लिस्ट में नहीं – लिखें</option>
            ${opts(sellable, l.id, x => label(x) + stockTag(x))}
          </select>
          ${l.custom ? `<label>Item name · आइटम का नाम</label>
            <input id="cname${i}" value="${esc(l.name)}" placeholder="e.g. Pillow cover, Mosquito net" oninput="saleLines[${i}].name=this.value">` : ''}
          <div class="row">
            <div><label>Qty · संख्या</label><input type="number" inputmode="numeric" min="1" value="${esc(l.qty)}" oninput="saleLines[${i}].qty=this.value;saleTotals()"></div>
            <div><label>Price · दाम</label><input type="number" inputmode="decimal" id="price${i}" value="${esc(l.price)}" oninput="saleLines[${i}].price=this.value;saleTotals()"></div>

          </div>
          ${l.custom ? '<div class="muted">It will be added to your item list with this price, so next time you can pick it. · अगली बार लिस्ट में मिलेगा।</div>' : ''}
        </div>`).join('')}
      </div>
      <button class="btn alt sm" onclick="saleLines.push({id:'',qty:1,price:''});sale()">+ Add item / और आइटम</button>
    </div>
    <div class="card">
      <h2>Customer · ग्राहक</h2>
      <div class="row">
        <div><label>Name · नाम</label><input id="sCust" list="custList" value="${esc(f.cust)}" placeholder="Optional if fully paid" oninput="fillPhone('sCust','sPhone')"></div>
        <div><label>Mobile · मोबाइल</label><input id="sPhone" type="tel" inputmode="tel" value="${esc(f.phone)}" oninput="lookupClient('sPhone','sCust','sChip')"></div>
      </div>
      <div id="sChip" style="margin-top:6px"></div>
      ${datalist('custList', D.clients.map(c => c.name))}
      <div class="row">
        <div><label>Discount · छूट</label><input id="sDisc" type="number" inputmode="decimal" value="${esc(f.disc || 0)}" oninput="saleTotals()"></div>
        <div><label>Paid now · अभी जमा</label><input id="sPaid" type="number" inputmode="decimal" value="${esc(f.paid)}" oninput="saleTotals()"></div>

      </div>
      <button class="btn alt sm" style="margin-top:8px" onclick="$('sPaid').value=saleNet();saleTotals()">Full paid / पूरा जमा</button>
      <div class="total"><span>Total · कुल</span><span id="sTotal">₹0</span></div>
      <div class="total" style="font-size:15px"><span>Balance (udhaar) · बाकी</span><span id="sBal" class="warn">₹0</span></div>
      <button class="btn full" onclick="doSale()">Save Bill · बिल सेव करें</button>
    </div>`;
  if (f.phone) lookupClient('sPhone', 'sCust', 'sChip');
  saleTotals();
}
function lineItem(i, id) {
  const l = saleLines[i];
  if (id === '__custom') {
    Object.assign(l, { id: '', custom: true, price: '', name: l.name || '', cost: '' });
    sale(); if ($('cname' + i)) $('cname' + i).focus();
    return;
  }
  const wasCustom = l.custom;
  Object.assign(l, { id, custom: false });
  const it = itemById(id);
  if (it) l.price = num(it.price);
  if (wasCustom) sale(); else { if (it) $('price' + i).value = num(it.price); saleTotals(); }
}
function saleNet() { return saleLines.reduce((s, l) => s + num(l.qty) * num(l.price), 0) - num(val('sDisc')); }
function saleTotals() {
  if (!$('sTotal')) return;
  const net = saleNet();
  $('sTotal').textContent = money(net);
  $('sBal').textContent = money(Math.max(0, net - num(val('sPaid'))));
}
function fillPhone(nameId, phoneId) {
  const c = D.clients.concat(D.customers, D.suppliers).find(x => x.name.toLowerCase() === val(nameId).toLowerCase() && x.phone);
  if (c && c.phone && !val(phoneId)) $(phoneId).value = c.phone;
}
async function doSale(allowShort) {
  const bad = saleLines.find(l => l.custom && !String(l.name || '').trim() && num(l.qty) > 0);
  if (bad) { toast('Write the item name / आइटम का नाम लिखें', true); return; }
  const args = { lines: saleLines.map(l => l.custom ? { name: l.name, qty: l.qty, price: l.price, cost: l.cost } : { id: l.id, qty: l.qty, price: l.price }),
    customer: val('sCust'), phone: val('sPhone'), discount: val('sDisc'), paid: val('sPaid'), mode: val('sMode'), allowShort: !!allowShort };
  let r;
  try { r = await save('saveSale', args, true); }
  catch (e) {
    const m = String((e && e.message) || e);
    if (m.indexOf('STOCK_SHORT') >= 0) {
      saleKeep();
      openModal(`${sheetHead('Stock is low · स्टॉक कम है')}
        <div>${esc(m.replace(/^.*STOCK_SHORT:\s*/, ''))}.</div>
        <div class="muted" style="margin-top:6px">If the item is really in the shop, the stock count in the app is probably not entered yet.
          You can sell anyway (stock will show minus), and fix it later with Stock → Correct stock.</div>
        <button class="btn full" onclick="closeModal();doSale(true)">Sell anyway · फिर भी बेचें</button>
        <button class="btn full alt" onclick="closeModal()">Go back · वापस</button>`);
    } else toast(m, true);
    return;
  }
  saleLines = []; saleForm = {};
  showBill(r.bill);
  go('home');
}
function billText(b) {
  const L = [`*${D.shop.name}*`];
  if (D.shop.address) L.push('\u{1F4CD} ' + D.shop.address);
  if (D.shop.phone || D.shop.owner) L.push('\u{1F4DE} ' + [D.shop.phone, D.shop.owner].filter(Boolean).join(' · '));
  L.push(`Bill: ${b.bill}   Date: ${b.date}`);
  if (b.customer) L.push('Customer: ' + b.customer);
  L.push('------------------------');
  b.lines.forEach(l => L.push(`${l.name} x${l.qty} = ₹${l.qty * l.price}`));
  L.push('------------------------');
  if (b.discount) L.push(`Discount / छूट: ₹${b.discount}`);
  L.push(`*Total / कुल: ₹${b.net}*`);
  if (b.advance) L.push(`Paid before / पहले जमा: ₹${b.advance}`);
  L.push(`Paid / जमा: ₹${b.paid}`);
  if (b.balance > 0) L.push(`*Balance / बाकी: ₹${b.balance}*`);
  L.push('', 'Thank you! / धन्यवाद \u{1F64F}');
  return L.join('\n');
}
function billImage(b) {
  const rows = [['Bill No · बिल नं.', b.bill], ['Date · तारीख', b.date]];
  if (b.customer) rows.push(['Customer · ग्राहक', b.customer]);
  if (b.phone) rows.push(['Mobile · मोबाइल', b.phone]);
  b.lines.forEach(l => rows.push([`${l.name}  × ${l.qty}  @ ${money(l.price)}`, money(l.qty * l.price)]));
  if (b.discount) { rows.push(['Items total · सामान का कुल', money(b.total)]); rows.push(['Discount · छूट', '− ' + money(b.discount)]); }
  const summary = [];
  if (b.advance) summary.push(['Paid before · पहले जमा', money(b.advance)]);
  summary.push(['Paid · जमा', money(b.paid)]);
  summary.push(['Balance · बाकी', money(Math.max(0, b.balance)), true, b.balance > 0 ? '#b3261e' : '#1e7b45']);
  return cardImage({ title: 'BILL · बिल', rows,
    big: { label: 'Total · कुल', value: money(b.net), color: '#1f4e79', bg: '#eaf1f8' },
    summary, stamp: b.balance <= 0 ? '✓ PAID · भुगतान हो गया' : '',
    footer: 'Thank you! · धन्यवाद — ' + D.shop.owner });
}
function showBill(b) {
  const img = billImage(b);
  openModal(`${sheetHead('Bill ' + esc(b.bill))}` + shareBlock(img, billText(b), b.phone, `Bill-${b.bill}.png`, 'Bill'));
}
/** Picture + the ways to send it. On a computer: Copy picture, then paste in WhatsApp. On a phone: Share picture. */
function shareBlock(img, text, phone, file, what) {
  lastShare = { img, text, file, phone };
  return `<img src="${img}" style="width:100%;border:1px solid var(--line);border-radius:10px" alt="${esc(what)} picture">
    <button class="btn full green" onclick="copyPicture()">Copy picture · फ़ोटो कॉपी करें</button>
    <a class="btn full green" target="_blank" href="${phoneLink(phone, 'Namaste! ' + what + ' from ' + D.shop.name + ' (picture below) / ' + D.shop.name + ' की रसीद')}">Open WhatsApp chat${phone ? ' with ' + esc(phone) : ''} · व्हाट्सएप खोलें</a>
    <div class="muted" style="margin:6px 0">Copy the picture, open the chat, then paste it (Mac: ⌘+V, phone: long-press → Paste).
      On a phone you can also long-press the picture → Share. · फ़ोटो कॉपी करें, चैट खोलें, पेस्ट करें।</div>
    <button class="btn full alt" onclick="sharePicture()">Share picture (phone) · शेयर</button>
    <a class="btn full alt" download="${esc(file)}" href="${img}">Download picture · डाउनलोड</a>
    <a class="btn full alt" target="_blank" href="${phoneLink(phone, text)}">Send as text message instead · टेक्स्ट भेजें</a>
    <button class="btn full alt" onclick="closeModal()">Done · हो गया</button>`;
}
async function copyPicture() {
  const sh = lastShare;
  try {
    // A promise inside ClipboardItem keeps Safari happy (the copy must start inside the click).
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': fetch(sh.img).then(r => r.blob()) })]);
    toast('Picture copied. Open the chat and paste (⌘+V) / फ़ोटो कॉपी हो गई');
  } catch (e) {
    toast('This browser blocked copying. Right-click the picture → Copy Image (phone: long-press → Copy).', true);
  }
}

/** After saving an Edit form: if stock was changed or added, save the new count (logged in StockLog). */
async function saveStockFields(kind, id) {
  const box = $('fStockNow');
  if (!box) return;
  const old = Number(box.dataset.old) || 0;
  const now = val('fStockNow') === '' ? old : Number(val('fStockNow'));
  const add = Number(val('fStockAdd')) || 0;
  const total = Math.round((now + add) * 1000) / 1000;
  if (!isFinite(total) || Math.abs(total - old) < 0.0005) return;
  if (total < 0) { toast('Stock cannot be minus / स्टॉक माइनस नहीं हो सकता', true); return; }
  const note = add ? `Added ${add} from Edit` + (Math.abs(now - old) >= 0.0005 ? `, set ${old} → ${now}` : '') : `Set from Edit (${old} → ${now})`;
  await save('adjustStock', { kind, id, stock: total, note });
}

function makePreview() {

    return `<div class="it"><div><div class="t">${esc(r.name)}</div><div class="s">${num(p.qty)} ${esc(r.unit)} per piece · have ${num(r.stock)}</div></div>

// --- Make for this order: uses raw material, records cost, marks Ready
let moRows = [], moItem = '';
const isCotton = r => /cotton|kapas|रुई|कपास/i.test(r.name);
function makeOrderForm(no) { moStart(no, (D.orders.find(x => x.no === no) || {}).itemId || ''); }
function moStart(no, itemId) {
  const o = D.orders.find(x => x.no === no);
  moItem = itemId;
  // Stock item: start from its recipe. Custom: list every raw material so only the amounts need typing.
  moRows = itemId ? recipeOf(itemId).map(r => ({ rawId: String(r.rawId), qty: num(r.qty) }))
    : D.raw.map(r => ({ rawId: String(r.id), qty: '' }));
  const wt = num(o.weight), cot = D.raw.find(isCotton);
  if (wt > 0 && cot) {   // order says "10 kg each": use that much cotton per piece
    const row = moRows.find(r => r.rawId === String(cot.id));
    if (row) row.qty = wt; else moRows.unshift({ rawId: String(cot.id), qty: wt });
  }
  if (!moRows.length) moRows = [{ rawId: '', qty: '' }];
  moDraw(no, itemId ? ((D.labour || {})[itemId] || 0) : 0);
}
function moDraw(no, labour) {
  const o = D.orders.find(x => x.no === no), q = num(o.qty) || 1;
  openModal(`${sheetHead('\u{1F9F5} Make for ' + esc(o.no))}
    <div class="t">${esc(o.customer)}</div><div class="muted">${esc(o.details)}</div>
    <label>Add to stock as · किस आइटम में</label>
    <select onchange="moStart('${esc(no)}', this.value)"><option value="">— Custom, not a stock item —</option>${opts(D.items, moItem, x => label(x))}</select>
    <h2 style="margin-top:14px">Raw material per piece · एक पीस में (× ${q})</h2>
    ${moRows.map((r, i) => `<div class="row" style="margin-top:6px">
      <select onchange="moRows[${i}].rawId=this.value;moCalc('${esc(no)}')"><option value="">— Raw —</option>${opts(D.raw, r.rawId, x => x.name + ' (' + x.unit + ')')}</select>
      <input type="number" inputmode="decimal" style="max-width:100px" value="${esc(r.qty)}" oninput="moRows[${i}].qty=this.value;moCalc('${esc(no)}')">
      <button class="btn sm red" style="flex:0" onclick="moRows.splice(${i},1);moDraw('${esc(no)}', val('moLab'))">✕</button></div>`).join('')}
    <button class="btn sm alt" style="margin-top:8px" onclick="moRows.push({rawId:'',qty:''});moDraw('${esc(no)}', val('moLab'))">+ Add raw / और जोड़ें</button>
    <label>Labour per piece · मजदूरी</label><input id="moLab" type="number" inputmode="decimal" value="${esc(labour)}" oninput="moCalc('${esc(no)}')">
    <div id="moSum" style="margin-top:10px"></div>
    <button class="btn full" onclick="doMakeOrder('${esc(no)}')">Use material & mark Ready · बनाओ और तैयार करो</button>`);
  moCalc(no);
}
function moCalc(no) {
  const o = D.orders.find(x => x.no === no), q = num(o.qty) || 1;
  let cost = 0, ok = true;
  const lines = moRows.filter(r => r.rawId && num(r.qty) > 0).map(r => {

/** Rebuilds the bill (for its picture) from the saved sale row. */
function saleBill(sl) {
  const lines = [];
  String(sl.items || '').split(/;\s*/).forEach(part => {
    const m = part.match(/^(.*) x([\d.]+) @([\d.]+)$/);
    if (m) lines.push({ name: m[1], qty: num(m[2]), price: num(m[3]) });
  });
  if (!lines.length || sl.ref) lines.splice(0, lines.length, { name: sl.items, qty: 1, price: num(sl.net) });
  return { bill: sl.bill, date: dmy(sl.date), customer: sl.customer, phone: sl.phone, lines, total: num(sl.total),
    discount: num(sl.discount), net: num(sl.net), paid: num(sl.paid), balance: num(sl.balance) };
}

function orderReceiptText(o, rcv) {
  const left = orderLeft(o), later = Math.round((orderPaid(o) - num(o.advance)) * 100) / 100;
  const L = [`*${D.shop.name}*`, `\u{1F4CD} ${D.shop.address} · \u{1F4DE} ${D.shop.phone}`, '', `*ORDER RECEIPT / ऑर्डर रसीद*`,
    `Order No: ${o.no}   Date: ${dmy(o.date)}`, `Customer: ${o.customer}${o.phone ? ' (' + o.phone + ')' : ''}`, '------------------------',
    o.details];
  if (num(o.qty) > 1 && num(o.rate)) L.push(`Rate: ₹${num(o.rate)} each`);
  L.push('------------------------', `Total / कुल: ₹${num(o.amount)}`, `Advance paid / एडवांस: ₹${num(o.advance)} (${o.mode || 'Cash'})`);

  L.push(left > 0 ? `*Remaining / बाकी: ₹${left}* (at delivery)` : '✅ *Fully paid / पूरा भुगतान हो गया*', '', `\u{1F4C5} *Delivery date / डिलीवरी: ${dmy(o.delivery)}*`);
  if (o.note) L.push('Note: ' + o.note);

/** Draws a receipt card as a picture (PNG data URL). Long values wrap onto their own lines. */
function cardImage(spec) {
  const W = 720, PAD = 40;
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const F = (w, size) => `${w} ${size}px system-ui, "Noto Sans Devanagari", sans-serif`;
  function wrap(text, width) {
    const words = String(text).split(' '), lines = [];
    let cur = '';
    words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > width && cur) { lines.push(cur); cur = w; } else cur = t; });
    if (cur) lines.push(cur);
    return lines;
  }
  // measure first, so the picture is exactly as tall as needed
  const layout = spec.rows.map(([k, v]) => {
    x.font = F('normal', 22); const kw = x.measureText(k).width;
    x.font = F('bold', 24);
    const fits = x.measureText(String(v)).width <= W - 2 * PAD - kw - 24;
    return { k, v: String(v), fits, lines: fits ? [String(v)] : wrap(v, W - 2 * PAD) };
  });
  let H = 270;
  layout.forEach(r => { H += r.fits ? 56 : 36 + r.lines.length * 34 + 22; });
  H += (spec.big ? 150 : 0) + spec.summary.length * 46 + (spec.stamp ? 120 : 0) + 50;
  c.width = W; c.height = H;
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#1f4e79'; x.fillRect(0, 0, W, 150);
  x.fillStyle = '#fff'; x.textAlign = 'center';
  x.font = F('bold', 40); x.fillText(D.shop.name, W / 2, 62);
  x.font = F('normal', 22); x.fillText(D.shop.address, W / 2, 100);
  x.fillText('\u{1F4DE} ' + D.shop.phone + ' · ' + D.shop.owner, W / 2, 132);
  x.fillStyle = '#1d1d1f'; x.font = F('bold', 30); x.fillText(spec.title, W / 2, 205);
  let y = 270; x.textAlign = 'left';
  layout.forEach(r => {
    x.fillStyle = '#6b6b70'; x.font = F('normal', 22); x.fillText(r.k, PAD, y);
    x.fillStyle = '#1d1d1f'; x.font = F('bold', 24);
    if (r.fits) { x.textAlign = 'right'; x.fillText(r.v, W - PAD, y); x.textAlign = 'left'; y += 56; }
    else { y += 36; r.lines.forEach(l => { x.fillText(l, PAD, y); y += 34; }); y += 22; }
  });
  if (spec.big) {
    x.fillStyle = spec.big.bg; x.fillRect(30, y - 10, W - 60, 110);
    x.fillStyle = spec.big.color; x.textAlign = 'center'; x.font = F('normal', 24); x.fillText(spec.big.label, W / 2, y + 28);
    x.font = F('bold', 52); x.fillText(spec.big.value, W / 2, y + 86);
    y += 150; x.textAlign = 'left';
  }
  x.strokeStyle = '#e2ddd2'; x.lineWidth = 1; x.beginPath(); x.moveTo(PAD, y - 30); x.lineTo(W - PAD, y - 30); x.stroke();
  spec.summary.forEach(([k, v, strong, color]) => {
    x.fillStyle = strong ? '#1d1d1f' : '#6b6b70'; x.font = F(strong ? 'bold' : 'normal', strong ? 26 : 22); x.fillText(k, PAD, y);
    x.textAlign = 'right'; x.fillStyle = color || '#1d1d1f'; x.fillText(v, W - PAD, y); x.textAlign = 'left';
    y += 46;
  });
  if (spec.stamp) {
    y += 20; x.save(); x.translate(W / 2, y + 20); x.rotate(-0.05);
    x.font = F('bold', 30); const sw = x.measureText(spec.stamp).width + 48;
    x.strokeStyle = '#1e7b45'; x.lineWidth = 4; x.strokeRect(-sw / 2, -38, sw, 76);
    x.fillStyle = '#1e7b45'; x.textAlign = 'center'; x.fillText(spec.stamp, 0, 11);
    x.restore();
  }
  x.fillStyle = '#6b6b70'; x.textAlign = 'center'; x.font = F('normal', 20);
  x.fillText(spec.footer, W / 2, H - 24);
  return c.toDataURL('image/png');
}
function receiptImage(rc) {
  const cleared = rc.after <= 0.5;

  ['year', 'Year · साल'], ['fy', 'Financial year · वित्त वर्ष'], ['custom', 'Custom · तारीख से तारीख']];
const RP_SECTIONS = [['summary', 'Summary & P&L · सारांश'], ['bahi', 'Bahi Khata · बही'], ['sales', 'Sales · बिक्री'], ['orders', 'Orders · ऑर्डर'],
  ['purchases', 'Purchases · खरीद'], ['expenses', 'Expenses · खर्चे'], ['udhaar', 'Customer udhaar · उधार'], ['vyapari', 'Vyapari dues · व्यापारी'],
  ['stock', 'Stock · स्टॉक']];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let RP = null, RPdata = null;
const ymd = (y, m, d) => new Date(Date.UTC(y, m - 1, d)).toISOString().slice(0, 10);
const ymdParts = iso => iso.split('-').map(Number);
const lastDay = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
function rpRange(type, a) {
  const [y, m, d] = ymdParts(a);
  if (type === 'day') return [a, a];
  if (type === 'week') { const wd = (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7; return [ymd(y, m, d - wd), ymd(y, m, d - wd + 6)]; } // Mon–Sun
  if (type === 'month') return [ymd(y, m, 1), ymd(y, m, lastDay(y, m))];
  if (type === 'quarter') { const s = Math.floor((m - 1) / 3) * 3 + 1; return [ymd(y, s, 1), ymd(y, s + 2, lastDay(y, s + 2))]; }
  if (type === 'year') return [ymd(y, 1, 1), ymd(y, 12, 31)];
  const fy = m >= 4 ? y : y - 1; return [ymd(fy, 4, 1), ymd(fy + 1, 3, 31)];   // financial year Apr–Mar
}
function rpApplyRange() { if (RP.type !== 'custom') [RP.from, RP.to] = rpRange(RP.type, RP.anchor); RPdata = null; }
function rpShift(n) {
  const [y, m, d] = ymdParts(RP.anchor), t = RP.type;
  RP.anchor = t === 'day' ? ymd(y, m, d + n) : t === 'week' ? ymd(y, m, d + 7 * n) : t === 'month' ? ymd(y, m + n, 1)
    : t === 'quarter' ? ymd(y, m + 3 * n, 1) : ymd(y + n, m, 1);
  rpApplyRange(); reports();
}
function rpLabel() {
  const [y, m] = ymdParts(RP.from);
  switch (RP.type) {
    case 'day': return dmy(RP.from) + (RP.from === D.today ? ' · Today' : '');
    case 'week': return 'Week ' + dmy(RP.from).slice(0, 5) + ' – ' + dmy(RP.to);
    case 'month': return MONTHS[m - 1] + ' ' + y;
    case 'quarter': return MONTHS[m - 1] + '–' + MONTHS[m + 1] + ' ' + y;
    case 'year': return 'Year ' + y;
    default: return 'FY ' + y + '-' + String(y + 1).slice(2) + ' (Apr–Mar)';
  }
}
function rpType(k) {
  RP.type = k;
  if (k !== 'custom') RP.anchor = D.today;
  rpApplyRange(); reports();
}
function rpToggle(k) { RP.sections.has(k) ? RP.sections.delete(k) : RP.sections.add(k); RPdata = null; reports(); }
function rpAll(on) { RP.sections = new Set(on ? RP_SECTIONS.map(s => s[0]) : []); RPdata = null; reports(); }
function reports() {
  if (!RP) { RP = { type: 'month', anchor: D.today, sections: new Set(RP_SECTIONS.map(s => s[0])) }; rpApplyRange(); }
  const custom = RP.type === 'custom';
  if (custom && !RP.from) { RP.from = ymd(...ymdParts(D.today).slice(0, 2), 1); RP.to = D.today; }
  $('app').innerHTML = `
    <div class="card"><h2>Period · अवधि</h2>
      <div class="chips">${RP_TYPES.map(([k, l]) => `<button class="${RP.type === k ? 'on' : ''}" onclick="rpType('${k}')">${l}</button>`).join('')}</div>
      ${custom ? `<div class="row" style="margin-top:10px">
          <div><label>From · से</label><input id="rpFrom" type="date" value="${RP.from}" onchange="RP.from=this.value;RPdata=null"></div>
          <div><label>To · तक</label><input id="rpTo" type="date" value="${RP.to}" onchange="RP.to=this.value;RPdata=null"></div></div>`
        : `<div class="datenav" style="margin-top:10px"><button class="btn alt sm" onclick="rpShift(-1)" aria-label="Previous">◀</button>
          <div class="rplabel">${esc(rpLabel())}<div class="muted">${dmy(RP.from)} → ${dmy(RP.to)}</div></div>
          <button class="btn alt sm" onclick="rpShift(1)" aria-label="Next">▶</button></div>`}
    </div>
    <div class="card"><h2>Include · क्या शामिल करें</h2>
      <div class="chips">${RP_SECTIONS.map(([k, l]) => `<button class="${RP.sections.has(k) ? 'on' : ''}" onclick="rpToggle('${k}')">${RP.sections.has(k) ? '✓ ' : ''}${l}</button>`).join('')}</div>
      <div class="chips" style="margin-top:8px"><button onclick="rpAll(true)">Select all · सभी</button><button onclick="rpAll(false)">Clear · हटाएं</button></div>
    </div>
    <div class="row">
      <button class="btn" onclick="rpShow()">\u{1F441} Show · देखें</button>
      <button class="btn alt" onclick="rpExport('pdf')">\u{1F4C4} PDF</button>
      <button class="btn alt" onclick="rpExport('xlsx')">\u{1F4CA} Excel</button>
    </div>
    <div id="rpOut" style="margin-top:12px"></div>`;
  if (RPdata) rpDraw();
}
function rpArgs() {
  if (RP.type === 'custom') { RP.from = val('rpFrom'); RP.to = val('rpTo'); }
  if (!RP.from || !RP.to || RP.from > RP.to) { toast('"From" date must be before "To" date / सही तारीख चुनें', true); return null; }
  if (!RP.sections.size) { toast('Choose at least one section / कम से कम एक चुनें', true); return null; }
  return { from: RP.from, to: RP.to, sections: RP_SECTIONS.map(s => s[0]).filter(k => RP.sections.has(k)) };
}
async function rpShow() {
  const a = rpArgs(); if (!a) return;
  RPdata = await api('getReport', a);
  rpDraw();
  $('rpOut').scrollIntoView({ behavior: 'smooth' });
}
function rpTable(t) {
  const summary = t.headers.every(h => !h);
  const head = t.title ? `<h3 class="rptitle">${esc(t.title)}</h3>` : '';
  if (summary) {
    return head + t.rows.map((r, i) => `<div class="sumrow ${String(r[0]).startsWith('=') ? 'big' : ''}"><span>${esc(r[0])}</span>
      <b>${t.rowMoney && t.rowMoney[i] ? money(r[1]) : num(r[1]).toLocaleString('en-IN')}</b></div>`).join('');
  }
  const isM = c => (t.money || []).includes(c);
  const td = (v, c) => isM(c) && v !== '' ? `<td class="n">${money(v)}</td>` : typeof v === 'number' ? `<td class="n">${v.toLocaleString('en-IN')}</td>` : `<td>${esc(v)}</td>`;
  if (!t.rows.length) return head + '<div class="muted" style="padding:6px 0 10px">No entries in this period / इस अवधि में कोई एंट्री नहीं</div>';
  return head + `<div class="tblwrap"><table class="rp"><thead><tr>${t.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${t.rows.map(r => `<tr>${r.map(td).join('')}</tr>`).join('')}</tbody>
    ${t.total ? `<tfoot><tr>${t.total.map(td).join('')}</tr></tfoot>` : ''}</table></div>`;
}
function rpDraw() {
  const R = RPdata;
  $('rpOut').innerHTML = `<div class="card"><h2>${esc(R.shop.name)} · Report</h2>
      <div class="muted">${dmy(R.from)}${R.from !== R.to ? ' to ' + dmy(R.to) : ''} · made ${esc(R.generated)}</div></div>
    ${R.groups.map(g => `<div class="card"><h2>${esc(g.title)}</h2>${g.tables.map(rpTable).join('')}</div>`).join('')}`;
}
async function rpExport(fmt) {
  const a = rpArgs(); if (!a) return;
  a.format = fmt;
  toast(`Making ${fmt === 'pdf' ? 'PDF' : 'Excel'}… this takes 10–30 seconds / बन रहा है…`);
  const r = await api('exportReport', a);
  if (r.data64) return rpFileReady(r, fmt);
  openModal(`${sheetHead((fmt === 'pdf' ? '\u{1F4C4} PDF' : '\u{1F4CA} Excel') + ' ready · तैयार')}
    <div class="t">${esc(r.name)}</div>
    <div class="muted" style="margin:6px 0">Saved in your Google Drive, folder "${esc(D.shop.name)} Reports". · गूगल ड्राइव में सेव हुआ।</div>
    <a class="btn full" target="_blank" href="${esc(r.url)}">Open · खोलें</a>
    <a class="btn full alt" target="_blank" href="${esc(r.download)}">⬇️ Download · डाउनलोड</a>
    <div class="muted" style="margin-top:8px">To send it on WhatsApp: open it, then use Share in Google Drive.</div>`);
}

/** Android app: the report file comes back in the reply; open, share or save it on the phone. */
let rpFile = null;
function rpFileReady(r, fmt) {
  const bytes = Uint8Array.from(atob(r.data64), c => c.charCodeAt(0));
  rpFile = new File([bytes], r.name, { type: r.mime });
  const url = URL.createObjectURL(rpFile);
  openModal(`${sheetHead((fmt === 'pdf' ? 'PDF' : 'Excel') + ' ready · तैयार')}
    <div class="t">${esc(r.name)}</div>
    <button class="btn full green" onclick="rpShareFile()">Share (WhatsApp, email…) · शेयर</button>
    <a class="btn full" href="${url}" download="${esc(r.name)}">Download to phone · डाउनलोड</a>
    <a class="btn full alt" href="${url}" target="_blank">Open · खोलें</a>
    <div class="muted" style="margin-top:8px">A copy is also saved in the owner's Google Drive, folder "${esc(D.shop.name)} Reports".</div>`);
}
async function rpShareFile() {
  try {
    if (navigator.canShare && navigator.canShare({ files: [rpFile] })) { await navigator.share({ files: [rpFile], title: rpFile.name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  toast('Sharing not available here. Use Download, then share from Files.', true);
}

// ---------- start ----------
function start() {
  $('app').setAttribute('data-ok', '1');   // main script is running
  if (APP && !store.get('sgg_token')) return loginScreen();
  $('app').innerHTML = '<div class="loading">Loading… / लोड हो रहा है…</div>';
  setTimeout(() => {
    if (!D && /Loading/.test($('app').textContent)) $('app').innerHTML = `<div class="card" style="margin-top:20px"><h2>Still loading… · लोड हो रहा है</h2>
      <div class="muted">The first open after an update can take up to a minute while new columns are added to the sheet.
        If it stays like this, tap ⟳ or reload the page. Check that Code.gs was pasted completely and Saved.</div>
      <button class="btn full alt" onclick="start()">Try again · फिर से</button></div>`;
  }, 40000);
  return api('getData', null, true).then(d => { D = d; go('home'); }).catch(e => {
    if (APP && !store.get('sgg_token')) return;   // token expired: login screen already shown
  $('app').innerHTML = `<div class="card" style="margin-top:20px"><h2 class="low">Could not load / लोड नहीं हुआ</h2>
    <div>${esc((e && e.message) || e)}</div>
    <div class="muted" style="margin-top:8px">Check internet and tap ⟳. If it says "Access denied", ask the owner to add your Gmail.
      If it says a sheet is missing, open Apps Script and run <b>setup</b> once.</div></div>`;
  });
}
start();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
